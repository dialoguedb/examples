name: Claude

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-6' }}

jobs:
  review:
    if: github.event_name == 'pull_request'
    concurrency:
      group: ${{ github.workflow }}-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DIALOGUEDB_BOT_APP_ID }}
          private-key: ${{ secrets.DIALOGUEDB_BOT_PRIVATE_KEY }}
          owner: dialoguedb

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.bot-token.outputs.token }}
          allowed_bots: "dialoguedb-bot[bot]"
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --allowedTools "Read,Glob,Grep,Bash(ls:*),Bash(cat:*),Bash(pwd:*),Bash(find:*),Bash(cd:*),Bash(npm install:*),Bash(npx tsc:*),Bash(node:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
            --max-turns 60
          prompt: |
            Review this PR. Check: 1) Does it compile? 2) README quality. 3) Code quality — real `dialogue-db` SDK usage per the CLAUDE.md standards (no `any`, no type casting, no `@ts-ignore`, cleanup after itself). 4) .env.example with all required vars, no real keys. Be constructive.

            Compile-check protocol — run each command as a SEPARATE tool call. Do NOT chain with `&&`. The tool allowlist matches the leading command token, so `cd X && npm install` matches neither `Bash(cd:*)` nor `Bash(npm install:*)` and gets denied, burning turns for nothing. Correct sequence:

            1. Find the example directory: `gh pr diff --name-only` and read the first path segment.
            2. `cd <example-dir>` — separate call.
            3. `npm install` — separate call.
            4. `npx tsc --noEmit` — separate call.

            When you have your findings, post ONE PR comment using `gh pr comment`: a short verdict line (LGTM / needs changes / questions), then, if not clean, a bulleted list where each bullet cites file + concern (`vercel-ai-sdk/src/index.ts:42 — <issue>`). No inline review comments.

  interactive:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    concurrency:
      group: ${{ github.workflow }}-interactive-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DIALOGUEDB_BOT_APP_ID }}
          private-key: ${{ secrets.DIALOGUEDB_BOT_PRIVATE_KEY }}
          owner: dialoguedb

      # Acknowledge the @claude trigger immediately with a 👀 reaction so the
      # human knows the assistant picked it up. Runs before checkout (which
      # can take 30+ seconds) so the eyes appear fast.
      - name: React with eyes
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REVIEW_ID: ${{ github.event.review.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENT" in
            issue_comment)
              gh api "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes || echo "::warning::reaction failed for $EVENT"
              ;;
            pull_request_review_comment)
              gh api "repos/${REPO}/pulls/comments/${COMMENT_ID}/reactions" -f content=eyes || echo "::warning::reaction failed for $EVENT"
              ;;
            pull_request_review)
              gh api "repos/${REPO}/issues/${PR_NUMBER}/reactions" -f content=eyes || echo "::warning::reaction failed for pull_request_review #${PR_NUMBER}"
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          git config user.name "dialoguedb-bot[bot]"
          git config user.email "dialoguedb-bot[bot]@users.noreply.github.com"
          git config --global credential.helper store
          echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.bot-token.outputs.token }}
          allowed_bots: "dialoguedb-bot[bot]"
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(cat:*),Bash(ls:*),Bash(mkdir:*),Bash(node:*),Bash(npm install:*),Bash(npm run:*),Bash(npx:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh workflow run:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr comment:*),WebFetch(domain:backend.dialoguedb.com),WebFetch(domain:docs.dialoguedb.com),WebFetch(domain:www.npmjs.com)"
            --max-turns 50
            --system-prompt "This is the DialogueDB examples repo. Each directory is a self-contained integration example. Examples must compile, have a README, and use the real dialogue-db SDK. When making code changes, verify by running `cd <example-dir>`, then `npm install`, then `npx tsc --noEmit` as SEPARATE tool calls — do not chain with && or the allowlist denies them. If someone asks you to implement, fix, or build something on an issue, dispatch it via gh workflow run daily-example.yml, then comment confirming. Only dispatch for implementation requests, not questions."
